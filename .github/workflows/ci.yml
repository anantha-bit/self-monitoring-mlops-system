name: Self-Monitoring MLOps CI Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-validate:
    name: Run Test Suite, Lint & Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install httpx flake8 pytest-cov coverage

    - name: Code Quality & Syntax Lint
      run: |
        flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Execute Full Test Suite (TC-01 through TC-25) & Coverage
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/ --cov=app --cov-branch --cov-report=term-missing -v

    - name: Build Docker Container (TC-15)
      run: |
        docker build -t self-monitoring-mlops:latest .
