name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop", "feature/*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install httpx pytest pytest-asyncio flake8

    - name: Code Quality & Syntax Lint
      run: |
        # Stop build if syntax errors or undefined names exist
        flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treat all other warnings as non-fatal
        flake8 app tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Execute Full Test Suite (TC-01 through TC-18)
      run: |
        pytest tests/ -v --durations=10

    - name: Build Docker Container (TC-15)
      run: |
        docker build -t self-monitoring-mlops:latest .
