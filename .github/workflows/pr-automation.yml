name: PR Automation and Labeling

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pr-labeler:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Label PR by Branch Name & Sprint
      uses: actions/github-script@v7
      with:
        script: |
          const branchName = context.payload.pull_request.head.ref.toLowerCase();
          const labels = [];
          
          if (branchName.includes('sprint-1') || branchName.includes('sprint1')) {
            labels.push('sprint-1');
          } else if (branchName.includes('sprint-2') || branchName.includes('sprint2')) {
            labels.push('sprint-2');
          }
          
          if (branchName.includes('feature')) {
            labels.push('FR');
          }
          if (branchName.includes('security') || branchName.includes('audit')) {
            labels.push('security');
          }
          
          if (labels.length > 0) {
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: labels
            });
          }
